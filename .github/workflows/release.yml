name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Native arm64: build.py runs its toolchain in an arm64 container.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          path: e5-infoscreen-lvgl

      # build.py reads the backend's error translations from e5-linux next to this repository.
      - uses: actions/checkout@v4
        with:
          repository: sprd-linux-devs/e5-linux
          path: e5-linux
          sparse-checkout: openwrt/luci-app-t551m/htdocs/luci-static/resources/mu300/common.js
          sparse-checkout-cone-mode: false

      - uses: actions/cache@v4
        with:
          path: e5-infoscreen-lvgl/out/cache
          key: sources-${{ hashFiles('e5-infoscreen-lvgl/build.py') }}

      - name: Build
        working-directory: e5-infoscreen-lvgl
        run: python3 build.py

      - name: Package
        working-directory: e5-infoscreen-lvgl
        run: |
          name=e5-infoscreen-lvgl-${GITHUB_SHA::7}
          mkdir -p dist/$name
          cp out/e5-infoscreen-ui scripts/* dist/$name/
          (cd dist && zip -r $name.zip $name)
          echo "PACKAGE=dist/$name.zip" >> "$GITHUB_ENV"

      - name: Release
        working-directory: e5-infoscreen-lvgl
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" "$PACKAGE" out/e5-infoscreen-ui \
            --target "$GITHUB_SHA" \
            --title "Build ${{ github.run_number }} (${GITHUB_SHA::7})" \
            --notes "$(git log -1 --format=%B)"
